<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#8fd3f4; --ink:#3a2414; --paper:#fff8ec; --edge:#7a4a25; --accent:#ff5d3a; --accent-ink:#fff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#20314f;--ink:#fbe9d0;--paper:#2b1d14;--edge:#c98a55}
}
:root[data-theme="dark"]{--bg:#20314f;--ink:#fbe9d0;--paper:#2b1d14;--edge:#c98a55}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;position:relative}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.chip{background:var(--paper);border:3px solid var(--edge);border-radius:14px;padding:4px 12px;
  font-family:'Lilita One',system-ui,sans-serif;font-size:clamp(15px,3.6vw,22px);box-shadow:0 3px 0 var(--edge)}
#time.low{color:var(--accent)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,18,8,.35)}
#ov.hide{display:none}
.card{background:var(--paper);border:4px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);
  padding:20px 22px;max-width:380px;width:100%;text-align:center;max-height:100%;overflow:auto}
h1{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(34px,9vw,48px);margin:0 0 4px;line-height:1;
  color:var(--accent);text-shadow:3px 3px 0 var(--edge)}
.card p{margin:6px 0;font-size:16px;line-height:1.4}
.pts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.pts div{font-size:28px;line-height:1.1}
.pts small{display:block;font-size:13px;font-weight:800}

<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="chip" id="score">⭐ 0</div>
  <div class="chip" id="time">⏱ 60</div>
  <div class="chip" id="best">🏆 0</div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---- perspektif: kamera sapanın arkasında ----
const camH=1.6, GW=20, D0=1.0, FAR=42;
let W,H,S,f,horizon,restY,h0,lake,clouds=[],tufts=[];
function P(x,h,d){const k=f/d;return{x:W/2+x*k,y:horizon+(camH-h)*k,k}}
function xmax(d){return (W/2)*d/f}
function resize(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.max(.7,Math.min(1.5,Math.min(W,H)/450));
  horizon=H*.42; f=(H*.98-horizon)*1.4/camH;
  restY=H*.80; h0=camH-(restY-horizon)*D0/f;
  lake={cd:16,rd:4,rx:Math.min(9,xmax(16)*.8)};
  clouds=[];for(let i=0;i<5;i++)clouds.push({x:rand(0,W),y:rand(H*.06,horizon*.7),s:rand(.6,1.2)*S,v:rand(6,16)});
  tufts=[];for(let i=0;i<70;i++){const d=rand(2,36);const x=rand(-1,1)*xmax(d);
    if(((x/lake.rx)**2+((d-lake.cd)/lake.rd)**2)<1.2)continue;tufts.push({x,d})}
  tufts.sort((a,b)=>b.d-a.d);
}
window.addEventListener('resize',resize);resize();

const TYPES={
  kus:{e:'🐦',pts:30,size:.6,hp:1},
  balik:{e:'🐟',pts:25,size:.6,hp:1},
  kurt:{e:'🐺',pts:20,size:.95,hp:1},
  kopek:{e:'🐕',pts:15,size:.85,hp:1},
  ayi:{e:'🐻',pts:40,size:1.35,hp:2}
};

// ---- ses ----
let AC;
function tone(fr,d,type='sine',v=.12,to=0){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

// ---- durum ----
let devamKullanildi=false;let state='menu',score=0,timeLeft=60,best=0,reload=0,spawnT=0,combo=0,lastHit=-9,clock=0;
let stones=[],animals=[],parts=[],texts=[],aim=null;
try{best=parseInt(localStorage.getItem('sapan-best')||'0',10)||0}catch(e){}
const MAXR=()=>Math.min(W,H)*.24;

function launchVel(dx,dy){
  const M=MAXR(),ux=-dx/M,uy=dy/M,len=Math.min(1,Math.hypot(ux,uy));
  const sp=11+20*len,yaw=ux*.55,pitch=.08+.75*Math.max(0,uy)-.3*Math.max(0,-uy);
  return{vx:sp*Math.cos(pitch)*Math.sin(yaw),vd:sp*Math.cos(pitch)*Math.cos(yaw),vh:sp*Math.sin(pitch)};
}

function spawn(){
  if(animals.filter(a=>!a.hit).length>=7)return;
  const kind=pick(['kus','kus','balik','balik','kurt','kopek','ayi']),T=TYPES[kind];
  const a={kind,e:T.e,size:T.size,r:T.size*.5,hp:T.hp,pts:T.pts,t:0,rot:0,alpha:1,hit:false,flash:0};
  const speedUp=1+(60-Math.min(60,timeLeft))/90, side=Math.random()<.5?-1:1;
  if(kind==='kus'){
    a.d=rand(8,26);a.x=side*(xmax(a.d)+1);a.vx=-side*rand(3,6)*speedUp;a.base=rand(3,7);a.h=a.base;a.amp=rand(.2,.7);a.fq=rand(2,4);
  }else if(kind==='balik'){
    a.d=rand(lake.cd-lake.rd*.6,lake.cd+lake.rd*.6);
    const xr=lake.rx*Math.sqrt(Math.max(0,1-((a.d-lake.cd)/lake.rd)**2))*.75;
    a.x=rand(-xr,xr);a.h=-.3;a.vx=rand(-1.2,1.2);a.vh=Math.sqrt(2*GW*rand(1.5,3.2));
  }else{
    a.d=Math.random()<.6?rand(6,11):rand(21,27);
    a.x=side*(xmax(a.d)+1.2);a.vx=-side*rand(1.2,2.6)*speedUp;a.life=rand(6,10);a.entered=false;a.h=0;
  }
  animals.push(a);
}
function wc(a){ // dünya merkezi
  if(a.hit||a.kind==='kus'||a.kind==='balik')return{x:a.x,h:a.h,d:a.d};
  return{x:a.x,h:a.size*.5+Math.abs(Math.sin(a.t*9))*.06,d:a.d};
}
function inLake(x,d){return (x/lake.rx)**2+((d-lake.cd)/lake.rd)**2<1}

function burst(x,y,n,cols,sc=1){for(let i=0;i<n;i++){const an=rand(0,Math.PI*2),sp=rand(60,240)*S*sc;
  parts.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-50*S*sc,t:rand(.4,.8),c:pick(cols),r:rand(2,5)*S*Math.max(.4,sc)});}}
function splashAt(x,d){const p=P(x,0,d);burst(p.x,p.y,10,['#bfe9ff','#7cc6f2','#ffffff'],Math.min(1.2,p.k/40));tone(500,.12,'sine',.05,180)}
function float(x,y,txt,c='#fff'){texts.push({x,y,txt,c,t:1})}

function hitAnimal(a,s){
  const c=wc(a),p=P(c.x,c.h,c.d);
  a.hp--;
  if(a.hp>0){a.flash=.35;a.vx=(a.vx>0?1:-1)*Math.abs(a.vx)*1.8;
    float(p.x,p.y-30*S,'Bonk!','#ffd23f');burst(p.x,p.y,8,['#ffd23f','#fff'],.7);tone(220,.15,'square',.08,120);return}
  a.hit=true;a.x=c.x;a.h=c.h;a.vx=s.vx*.25;a.vh=7;a.vd=4;a.spin=rand(-9,9);
  if(clock-lastHit<2)combo++;else combo=1;lastHit=clock;
  const mult=Math.min(3,1+(combo-1)*.5),far=1+Math.max(0,a.d-8)/20;
  const gain=Math.round(a.pts*mult*far);score+=gain;
  float(p.x,p.y-20*S,'+'+gain,'#fff');
  if(combo>1)float(p.x,p.y-50*S,'x'+mult+' Kombo!','#ffd23f');
  else if(far>1.4)float(p.x,p.y-50*S,'Uzak atış!','#9ff0ff');
  if(a.kind==='balik'){timeLeft+=2;float(p.x,p.y+22*S,'+2 sn','#9ff0ff')}
  burst(p.x,p.y,16,['#ffd23f','#ff5d3a','#ffffff','#7ee081'],Math.min(1.3,p.k/35+.3));
  tone(660+combo*80,.18,'triangle',.12,1200);
}

function update(dt){
  clock+=dt;timeLeft-=dt;reload=Math.max(0,reload-dt);
  if(timeLeft<=0){timeLeft=0;end();return}
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=rand(.6,1.3)*(timeLeft<20?.75:1)}

  for(const s of stones){
    const px=s.x,ph=s.h,pd=s.d;
    s.vh-=GW*dt;s.x+=s.vx*dt;s.h+=s.vh*dt;s.d+=s.vd*dt;
    for(const a of animals){if(a.hit)continue;const c=wc(a);
      if(pd<c.d&&s.d>=c.d){const t=(c.d-pd)/(s.d-pd),sx=px+(s.x-px)*t,sh=ph+(s.h-ph)*t;
        if(Math.hypot(sx-c.x,sh-c.h)<a.r*1.15+.15){hitAnimal(a,s);s.dead=true;break}}}
    if(s.dead)continue;
    if(s.h<=0){
      if(inLake(s.x,s.d))splashAt(s.x,s.d);
      else{const p=P(s.x,0,s.d);burst(p.x,p.y,6,['#a37752','#6b8f3a'],Math.min(1,p.k/40))}
      s.dead=true;
    }
    if(s.d>FAR)s.dead=true;
  }
  stones=stones.filter(s=>!s.dead);

  for(const a of animals){
    a.t+=dt;a.flash=Math.max(0,a.flash-dt);
    if(a.hit){a.vh-=GW*dt;a.x+=a.vx*dt;a.h+=a.vh*dt;a.d+=a.vd*dt;a.rot+=a.spin*dt;a.alpha-=dt*.9;if(a.alpha<=0)a.dead=true;continue}
    if(a.kind==='kus'){a.x+=a.vx*dt;a.h=a.base+Math.sin(a.t*a.fq)*a.amp;if(Math.abs(a.x)>xmax(a.d)+2&&a.t>1)a.dead=true}
    else if(a.kind==='balik'){a.vh-=GW*dt;a.x+=a.vx*dt;a.h+=a.vh*dt;
      a.rot=(a.vx>0?1:-1)*Math.atan2(a.vh,Math.abs(a.vx)*3+2)*.8;
      if(a.vh<0&&a.h<-.3){splashAt(a.x,a.d);a.dead=true}}
    else{
      a.x+=a.vx*dt;a.life-=dt;const lim=xmax(a.d)*.85;
      if(Math.abs(a.x)<lim)a.entered=true;
      if(a.life>0&&a.entered&&Math.abs(a.x)>lim&&Math.sign(a.x)===Math.sign(a.vx))a.vx=-a.vx;
      if(a.life<=0&&Math.abs(a.x)>xmax(a.d)+2)a.dead=true;
    }
  }
  animals=animals.filter(a=>!a.dead);
}

function ambient(dt){
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+120*S){c.x=-120*S;c.y=rand(H*.06,horizon*.7)}}
  for(const p of parts){p.vy+=500*S*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}
  parts=parts.filter(p=>p.t>0);
  for(const t of texts){t.y-=40*S*dt;t.t-=dt*.9}
  texts=texts.filter(t=>t.t>0);
}

// ---- çizim ----
function drawCloud(c){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
  [[0,0,28],[26,-10,24],[52,0,26],[24,8,26]].forEach(([x,y,r])=>{ctx.moveTo(c.x+x*c.s+r*c.s,c.y+y*c.s);ctx.arc(c.x+x*c.s,c.y+y*c.s,r*c.s,0,Math.PI*2)});ctx.fill()}

function drawScene(){
  const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#7cc8f2');sky.addColorStop(1,'#fde2b3');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon+2);
  ctx.fillStyle='rgba(255,216,107,.3)';ctx.beginPath();ctx.arc(W*.78,horizon*.32,56*S,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(W*.78,horizon*.32,36*S,0,Math.PI*2);ctx.fill();
  clouds.forEach(drawCloud);
  // uzak dağlar
  ctx.fillStyle='#a9c7d6';ctx.beginPath();ctx.moveTo(0,horizon);
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,horizon-28*S-Math.abs(Math.sin(x/W*Math.PI*3+.5))*40*S);
  ctx.lineTo(W,horizon);ctx.fill();
  ctx.fillStyle='#8fbf7a';ctx.beginPath();ctx.moveTo(0,horizon);
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,horizon-10*S-Math.sin(x/W*Math.PI*4)*8*S);
  ctx.lineTo(W,horizon);ctx.fill();
  // zemin
  const gr=ctx.createLinearGradient(0,horizon,0,H);gr.addColorStop(0,'#a6d68a');gr.addColorStop(1,'#3f9a45');
  ctx.fillStyle=gr;ctx.fillRect(0,horizon,W,H-horizon);
  // ufuktaki ağaçlar
  ctx.textAlign='center';ctx.textBaseline='bottom';
  for(let i=-6;i<=6;i++){const d=38,x=i*xmax(d)/5.5+Math.sin(i*7)*2,p=P(x,0,d);
    ctx.font=`${Math.max(10,3.2*p.k)}px serif`;ctx.fillText('🌲',p.x,p.y+2)}
  // gölet
  const w=ctx.createLinearGradient(0,P(0,0,lake.cd+lake.rd).y,0,P(0,0,lake.cd-lake.rd).y);
  w.addColorStop(0,'#8fd0f2');w.addColorStop(1,'#3a86c8');
  ctx.fillStyle=w;ctx.beginPath();
  for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,p=P(Math.cos(a)*lake.rx,0,lake.cd+Math.sin(a)*lake.rd);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  ctx.closePath();ctx.fill();ctx.strokeStyle='#5a8f3c';ctx.lineWidth=2*S;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5*S;
  for(let j=0;j<3;j++){const d=lake.cd-2+j*2,xr=lake.rx*Math.sqrt(1-((d-lake.cd)/lake.rd)**2)*.7;ctx.beginPath();
    for(let i=0;i<=20;i++){const x=-xr+i/20*2*xr,p=P(x,Math.sin(i*.9+clock*3+j)*.04,d);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke()}
  // çimen tutamları
  ctx.strokeStyle='#2f7d36';ctx.lineCap='round';
  for(const t of tufts){const p=P(t.x,0,t.d),s=.25*p.k;ctx.lineWidth=Math.max(1,s*.18);ctx.beginPath();
    ctx.moveTo(p.x-s*.4,p.y-s);ctx.lineTo(p.x,p.y);ctx.lineTo(p.x+s*.4,p.y-s);ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-s*1.2);ctx.stroke()}
}

function drawAnimal(a){
  const c=wc(a),p=P(c.x,c.h,c.d),px=a.size*p.k*1.15;
  if(!a.hit&&a.kind!=='kus'&&a.kind!=='balik'){const g=P(c.x,0,c.d);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(g.x,g.y,px*.4,px*.08,0,0,Math.PI*2);ctx.fill()}
  if(a.kind==='kus'&&!a.hit){const g=P(c.x,0,c.d);ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.ellipse(g.x,g.y,px*.3,px*.06,0,0,Math.PI*2);ctx.fill()}
  ctx.save();ctx.globalAlpha=Math.max(0,a.alpha);ctx.translate(p.x,p.y);ctx.rotate(a.rot);
  if(a.vx>0&&!a.hit)ctx.scale(-1,1);
  if(a.kind==='kus')ctx.rotate(Math.sin(a.t*14)*.12);
  ctx.font=`${Math.max(9,px)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(a.flash>0){ctx.shadowColor='#ff3b1f';ctx.shadowBlur=18*S}
  ctx.fillText(a.e,0,0);ctx.restore();
  if(a.hit&&a.alpha>.5){ctx.font=`${Math.max(10,px*.4)}px serif`;ctx.textAlign='center';ctx.fillText('💫',p.x,p.y-px*.6)}
}
function drawStone(s){
  const p=P(s.x,s.h,s.d),r=Math.max(2,.13*p.k);
  const g=P(s.x,0,s.d);ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(g.x,g.y,r,r*.3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6b6b6b';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a0a0a0';ctx.beginPath();ctx.arc(p.x-r*.3,p.y-r*.3,r*.35,0,Math.PI*2);ctx.fill();
}

function drawSling(){
  const s=Math.min(W,H)/450,cx=W/2,ready=reload<=0&&state==='play';
  const pk={x:cx+(aim?aim.dx:0),y:restY+(aim?aim.dy:0)};
  const L={x:cx-70*s,y:restY-8*s},R={x:cx+70*s,y:restY-8*s},J={x:cx,y:restY+95*s};
  // nişan noktaları
  if(aim&&ready){
    const v=launchVel(aim.dx,aim.dy);let x=0,h=h0,d=D0,vh=v.vh;
    for(let i=1;i<=28;i++){for(let k=0;k<3;k++){vh-=GW*.02;x+=v.vx*.02;h+=vh*.02;d+=v.vd*.02}
      if(h<0||d>FAR)break;const p=P(x,h,d);
      ctx.fillStyle=`rgba(255,255,255,${Math.max(.15,.95-i*.03)})`;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,Math.min(6*s,.07*p.k)),0,Math.PI*2);ctx.fill()}
  }
  ctx.lineCap='round';ctx.lineJoin='round';
  // gövde (çatal)
  const wood=(w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
    ctx.moveTo(cx,H+30*s);ctx.lineTo(J.x,J.y);ctx.quadraticCurveTo(cx-55*s,J.y-20*s,L.x,L.y);
    ctx.moveTo(J.x,J.y);ctx.quadraticCurveTo(cx+55*s,J.y-20*s,R.x,R.y);ctx.stroke()};
  wood(30*s,'#4a2810');wood(22*s,'#8a5428');
  ctx.strokeStyle='#b07a44';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(cx-6*s,H+30*s);ctx.lineTo(cx-6*s,J.y+6*s);ctx.stroke();
  // lastikler + taş
  ctx.strokeStyle='#c0392b';ctx.lineWidth=7*s;
  ctx.beginPath();ctx.moveTo(L.x,L.y);
  if(ready){ctx.lineTo(pk.x,pk.y);ctx.lineTo(R.x,R.y)}else{ctx.quadraticCurveTo(cx,restY+14*s,R.x,R.y)}ctx.stroke();
  ctx.fillStyle='#4a2810';
  [L,R].forEach(q=>{ctx.beginPath();ctx.arc(q.x,q.y,9*s,0,Math.PI*2);ctx.fill()});
  if(ready){
    const grow=1+.35*Math.max(0,(aim?aim.dy:0))/MAXR(),r=13*s*grow;
    ctx.fillStyle='#6d3d1a';ctx.beginPath();ctx.ellipse(pk.x,pk.y+r*.3,r*1.25,r*.7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6b6b6b';ctx.beginPath();ctx.arc(pk.x,pk.y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#a0a0a0';ctx.beginPath();ctx.arc(pk.x-r*.3,pk.y-r*.3,r*.35,0,Math.PI*2);ctx.fill();
  }
}

function draw(){
  drawScene();
  const items=[...animals.map(a=>({d:wc(a).d,f:()=>drawAnimal(a)})),...stones.map(s=>({d:s.d,f:()=>drawStone(s)}))];
  items.sort((a,b)=>b.d-a.d).forEach(i=>i.f());
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  drawSling();
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.t*1.5);ctx.font=`${22*S}px 'Lilita One',system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5*S;ctx.strokeStyle='#3a2414';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y)}
  ctx.globalAlpha=1;
  $('score').textContent='⭐ '+score;
  $('time').textContent='⏱ '+Math.ceil(timeLeft);
  $('time').classList.toggle('low',timeLeft<10&&state==='play');
  $('best').textContent='🏆 '+best;
}

let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;
  if(state==='play')update(dt);ambient(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ---- kontrol ----
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||reload>0||aim)return;
  cv.setPointerCapture(e.pointerId);aim={ax:e.clientX,ay:e.clientY,dx:0,dy:0,id:e.pointerId};
});
cv.addEventListener('pointermove',e=>{
  if(!aim||e.pointerId!==aim.id)return;
  let dx=e.clientX-aim.ax,dy=e.clientY-aim.ay;const d=Math.hypot(dx,dy),m=MAXR();
  if(d>m){dx*=m/d;dy*=m/d}aim.dx=dx;aim.dy=dy;
});
cv.addEventListener('pointerup',e=>{
  if(!aim||e.pointerId!==aim.id)return;
  if(Math.hypot(aim.dx,aim.dy)>14*S&&state==='play'){
    const v=launchVel(aim.dx,aim.dy);stones.push({x:0,h:h0,d:D0,...v});
    reload=.35;tone(300,.12,'sawtooth',.06,700);
  }
  aim=null;
});
cv.addEventListener('pointercancel',()=>aim=null);

// ---- ekranlar ----
function legend(){return '<div class="pts">'+Object.values(TYPES).map(t=>`<div>${t.e}<small>${t.pts}</small></div>`).join('')+'</div>'}
function menu(){
  $('card').innerHTML=`<h1>Sapan Avı</h1>
  <p>Ekrana dokun, parmağını <b>aşağı çek</b>, sağa sola nişan al ve bırak. Ne kadar çekersen o kadar uzağa gider.</p>
  ${legend()}
  <p>🐻 Ayı iki taşta düşer. 🐟 Balık vurursan +2 saniye. Uzaktaki hayvanlar daha çok puan verir.</p>
  <button id="go">Başla</button>`;
  $('go').onclick=start;$('ov').classList.remove('hide');
}
function start(){
  tone(440,.1,'triangle',.08,880);
  score=0;timeLeft=60;combo=0;lastHit=-9;clock=0;stones=[];animals=[];parts=[];texts=[];reload=.3;spawnT=.3;
  devamKullanildi=false;state='play';$('ov').classList.add('hide');
}
function devamEt(){
  devamKullanildi=true;timeLeft=15;aim=null;state='play';$('ov').classList.add('hide');tone(660,.15,'triangle',.08,990);
}
function end(){
  state='over';aim=null;
  const rec=score>best;if(rec){best=score;try{localStorage.setItem('sapan-best',String(best))}catch(e){}}
  $('card').innerHTML=`<h1>Süre bitti!</h1><div class="big">⭐ ${score}</div>
  <p>${rec?'🎉 Yeni rekor!':'En iyi skorun: 🏆 '+best}</p><button id="rw" hidden>📺 Reklam izle, +15 sn</button><br><button id="go">Tekrar oyna</button>`;
  $('go').onclick=function(){Reklam.arada('sapan_tekrar',start)};$('ov').classList.remove('hide');tone(520,.25,'triangle',.1,260);
  if(!devamKullanildi){Reklam.odul('sapan_devam',function(goster){const b=$('rw');if(!b)return;b.hidden=false;b.onclick=function(){b.hidden=true;goster();};},devamEt);}
}
menu();
})();
</script>
</body>
</html>
